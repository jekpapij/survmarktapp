# CPMK 6 (Automated Pipeline & Store Distribution) — build App Bundle (AAB)
# release yang SUDAH DI-SIGN pakai keystore produksi beneran, otomatis
# lewat GitHub Actions. Scope yang dipilih (2026-09-11): sampai "AAB signed
# siap diunggah" doang (tier "Baik" rubrik) — TIDAK auto-upload ke Google
# Play Console (butuh akun developer berbayar, di luar scope yang dipilih).
#
# Keystore & google-services.json TIDAK PERNAH ada di repo (lihat
# .gitignore) — di-tulis ulang di sini SAAT RUNTIME doang dari GitHub
# Actions Secrets, di runner yang sifatnya ephemeral (dibuang otomatis abis
# job selesai, nggak ninggalin jejak di manapun).
#
# WAJIB di-set dulu di GitHub: Settings > Secrets and variables > Actions >
# "New repository secret", 6 secret ini (lihat CLAUDE.md CPMK 6 buat cara
# dapetin/generate tiap nilainya):
#   KEYSTORE_BASE64              (base64 dari file release-keystore.jks)
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD
#   SUPABASE_FUNCTIONS_URL       (sama kayak yang dipakai `flutter run`)
#   GOOGLE_SERVICES_JSON_BASE64  (OPSIONAL — base64 dari google-services.json,
#                                 kalau nggak di-set, AAB tetap ke-build tapi
#                                 fitur Firebase nggak bakal jalan pas dibuka)

name: Build Release AAB

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks

      - name: Decode google-services.json (optional — Firebase)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 not set, skipping Firebase configuration"
          fi

      - name: Build signed App Bundle
        env:
          # Dibaca `android/app/build.gradle.kts` — path relatif ke folder
          # `android/app/` (tempat file-nya barusan di-decode ke atas).
          KEYSTORE_PATH: release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --dart-define=USE_FIREBASE_BACKEND=true \
            --dart-define=USE_MOCK_BACKEND=false \
            --dart-define=SUPABASE_FUNCTIONS_URL=${{ secrets.SUPABASE_FUNCTIONS_URL }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: survmarkt-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
