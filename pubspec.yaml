name: survmarkt
description: SurvMarkt — Marketplace Responden Penelitian
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^12.0.0

  # HTTP Client
  dio: ^5.4.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0

  # Connectivity (CPMK 4 — deteksi online/offline buat pola Offline-First)
  connectivity_plus: ^6.0.3

  # Utils
  intl: ^0.18.1
  equatable: ^2.0.5
  dartz: ^0.10.1       # Either<Failure, Success>
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.1

  # UI
  google_fonts: ^6.1.0  # Fallback jika font tidak di-bundle manual
  cached_network_image: ^3.3.0

  # Firebase (untuk Push Notification nanti)
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0

  # Firebase Authentication — "Masuk dengan Google" BENERAN (bukan
  # simulasi dummy lagi, lihat CLAUDE.md "Google Sign-In BENERAN via
  # Firebase"). Setup Firebase Console (SHA-1, google-services.json, dst)
  # WAJIB kelar duluan sebelum ini beneran bisa dipakai.
  firebase_auth: ^5.3.0
  google_sign_in: ^6.2.1

  # CPMK 5 (Integration Engine) — backend beneran (Firestore, scope Auth+
  # Wallet dulu) dan buka halaman pembayaran Midtrans (Snap redirect_url) di
  # browser. Lihat CLAUDE.md buat checklist setup Firebase Console (enable
  # Firestore) yang WAJIB dikerjain user sendiri.
  cloud_firestore: ^5.4.0
  url_launcher: ^6.3.0

  # Update 2026-09-10: Payment Gateway Midtrans dipindah dari Firebase Cloud
  # Functions (`cloud_functions` — WAJIB plan Blaze/prepayment) ke Supabase
  # Edge Functions (gratis, lihat `midtrans_service.dart`) — dipanggil pakai
  # HTTP POST biasa, bukan SDK Firebase lagi.
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  hive_generator: ^2.0.0

  # Testing
  mockito: ^5.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    # Lora
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lora-Italic.ttf
          weight: 400
          style: italic

    # Inter — gunakan set 18pt untuk UI
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_18pt-ExtraBold.ttf
          weight: 800

    # JetBrains Mono
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500